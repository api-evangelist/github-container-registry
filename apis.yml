aid: github-container-registry
name: GitHub Container Registry
description: >-
  GitHub Container Registry stores container images within your GitHub organization or personal account, allows you to
  associate images with repositories, and provides fine-grained permissions for managing access. It supports Docker and
  OCI image formats and is integrated with GitHub Actions for automated workflows.
